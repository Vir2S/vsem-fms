name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          API_KEY: ci-test-api-key-0123456789
          LOG_DIR: /tmp/vsem-fms-ci-logs
        run: pytest -q

      - name: Compile Python sources
        env:
          API_KEY: ci-test-api-key-0123456789
        run: python -m compileall -q vsem_fms

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          sed -i 's/^API_KEY=.*/API_KEY=ci-test-api-key-0123456789/' .env
          docker compose config --quiet

      - name: Build Docker image
        run: docker build -f vsem_fms/Dockerfile -t vsem-fms:ci .
